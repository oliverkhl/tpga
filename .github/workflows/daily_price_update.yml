name: Daily AUD/USD rate sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Send the live rate to Cloudflare
        env:
          PRICE_UPDATE_URL: https://twoparrotsgroup.com.au/api/prices/survey
          PRICE_UPDATE_SECRET: ${{ secrets.PRICE_UPDATE_SECRET }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python update_prices.py
